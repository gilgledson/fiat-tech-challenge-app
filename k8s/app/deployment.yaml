apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
      - name: oficina-api
        image: docker.io/gilgledson/oficina-api:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 8080
        # A app pode levar até ~1min pra subir (Flyway rodando todas as
        # migrations + seed em dev). O startupProbe segura o liveness/readiness
        # até a app realmente iniciar, evitando restart em loop por causa de
        # uma inicialização lenta sendo confundida com falha de saúde.
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: oficina-api-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: password
        - name: WEBHOOK_APROVACAO_SECRET
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: webhook-aprovacao-secret
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: azure-storage-connection-string
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: new-relic-license-key